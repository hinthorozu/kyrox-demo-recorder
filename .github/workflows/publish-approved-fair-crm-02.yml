name: Publish Approved FAIR CRM Tutorial 02

on:
  push:
    branches:
      - ROG
    paths:
      - "publish-requests/fair-crm-02-approved.txt"

permissions:
  contents: write
  actions: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      APPROVED_RUN_ID: "36726421846"
      RELEASE_TAG: "fair-crm-02-approved"
      RELEASE_TITLE: "FAIR CRM Tutorial 02 — Approved"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download exact approved artifact
        run: |
          mkdir -p approved/source
          gh run download "$APPROVED_RUN_ID"             --repo "${{ github.repository }}"             --name fair-crm-scene-setup-video             --dir approved/source

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Cut silent gap 01:32-01:49
        run: |
          mkdir -p approved/final

          ffmpeg -y             -i approved/source/fair-crm-02-sahne-olusturma.mp4             -filter_complex "[0:v]trim=0:92,setpts=PTS-STARTPTS[v0];[0:v]trim=start=109,setpts=PTS-STARTPTS[v1];[v0][v1]concat=n=2:v=1:a=0[v]"             -map "[v]"             -c:v libx264 -crf 20 -preset medium -pix_fmt yuv420p -movflags +faststart             approved/final/fair-crm-02-sahne-olusturma-kesilmis.mp4

          ffmpeg -y             -i approved/source/fair-crm-02-sahne-olusturma-piper.mp4             -filter_complex "[0:v]trim=0:92,setpts=PTS-STARTPTS[v0];[0:a]atrim=0:92,asetpts=PTS-STARTPTS[a0];[0:v]trim=start=109,setpts=PTS-STARTPTS[v1];[0:a]atrim=start=109,asetpts=PTS-STARTPTS[a1];[v0][a0][v1][a1]concat=n=2:v=1:a=1[v][a]"             -map "[v]" -map "[a]"             -c:v libx264 -crf 20 -preset medium -pix_fmt yuv420p             -c:a aac -b:a 192k -movflags +faststart             approved/final/fair-crm-02-sahne-olusturma-piper-kesilmis.mp4

      - name: Verify final files
        run: |
          test -f approved/final/fair-crm-02-sahne-olusturma-kesilmis.mp4
          test -f approved/final/fair-crm-02-sahne-olusturma-piper-kesilmis.mp4
          ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1 approved/final/fair-crm-02-sahne-olusturma-kesilmis.mp4
          ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1 approved/final/fair-crm-02-sahne-olusturma-piper-kesilmis.mp4

      - name: Publish permanent release assets
        run: |
          if gh release view "$RELEASE_TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG"               approved/final/fair-crm-02-sahne-olusturma-kesilmis.mp4               approved/final/fair-crm-02-sahne-olusturma-piper-kesilmis.mp4               --clobber               --repo "${{ github.repository }}"
          else
            gh release create "$RELEASE_TAG"               approved/final/fair-crm-02-sahne-olusturma-kesilmis.mp4               approved/final/fair-crm-02-sahne-olusturma-piper-kesilmis.mp4               --title "$RELEASE_TITLE"               --notes "Approved FAIR CRM tutorial 02. Permanent final versions only. The silent gap from 01:32 to 01:49 was removed. Contains silent and Piper-voiced MP4 versions."               --repo "${{ github.repository }}"
          fi
